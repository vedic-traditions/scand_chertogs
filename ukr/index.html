<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скандинавський чертог</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="preload" href="chertogs/Iggdrassil.webp?v=1.1" as="image">
    <style>
        /* CSS Variables */
        :root {
            --color-gold: #d4af37;
            --color-gold-light: #ffd700;
            --color-gold-dark: #b8860b;
            --color-bg-dark: #1a1a2e;
            --color-bg-darker: #16213e;
            --color-text: #fff;
            --color-text-muted: #ddd;
            --color-purple: #9966cc;
            --color-red: #ff6b6b;
            --border-radius-sm: 5px;
            --border-radius-md: 8px;
            --border-radius-lg: 10px;
            --border-radius-xl: 12px;
            --border-radius-xxl: 20px;
            --transition-fast: 0.3s ease;
            --shadow-gold: 0 0 15px rgba(212, 175, 55, 0.4);
            --shadow-gold-lg: 0 0 20px rgba(212, 175, 55, 0.5);
            --font-primary: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-decorative: 'Cinzel', serif;
            --font-body: 'Cormorant Garamond', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-primary);
            min-height: 100vh;
            height: 100vh;
            color: var(--color-text);
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('chertogs/Iggdrassil.webp?v=1.1') no-repeat center center;
            background-size: cover;
            z-index: -1;
            will-change: transform;
        }

        .btn {
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
            border: none;
            border-radius: var(--border-radius-md);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .btn:hover {
            background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold));
            transform: scale(1.02);
            box-shadow: var(--shadow-gold);
        }

        .mute-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--color-gold);
            color: var(--color-gold);
            padding: 10px 20px;
            font-size: 14px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .mute-btn:hover { background: rgba(212, 175, 55, 0.3); }

        /* Shop link buttons */
        .shop-link {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            font-family: var(--font-decorative);
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
            border: 2px solid var(--color-gold);
            border-radius: var(--border-radius-md);
            color: #000;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-align: center;
        }

        .shop-link:hover {
            background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold));
            transform: scale(1.02);
            box-shadow: var(--shadow-gold);
            border-color: var(--color-gold-light);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            height: 100vh;
            justify-content: space-between;
        }

        .date-calculator {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--color-gold);
            border-radius: var(--border-radius-xl);
            padding: 10px 20px;
            margin-bottom: 10px;
            text-align: center;
            max-height: 35vh;
        }
        .date-calculator h2 {
            color: var(--color-gold);
            margin-bottom: 8px;
            font-size: 18px;
        }

        .date-input { display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap; }

        .input-field {
            padding: 12px 20px;
            font-size: 16px;
            font-family: var(--font-decorative);
            border: 2px solid var(--color-gold);
            border-radius: var(--border-radius-md);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.8), rgba(26, 26, 46, 0.9));
            color: var(--color-gold-light);
            text-align: center;
            transition: all var(--transition-fast);
        }
        .input-field:hover, .input-field:focus {
            border-color: var(--color-gold-light);
            box-shadow: var(--shadow-gold);
            outline: none;
        }

        .calendar-wrapper { position: relative; max-width: 320px; margin: 0 auto; }
        .date-input-field { width: 100%; cursor: pointer; }

        .custom-calendar-popup {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.98), rgba(46, 26, 46, 0.98));
            border: 2px solid var(--color-gold);
            border-radius: var(--border-radius-lg);
            padding: 15px;
            width: 320px;
            z-index: 1000;
            margin-top: 5px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .custom-calendar-popup.active { display: block; }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .nav-btn {
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--color-gold);
            color: var(--color-gold);
            font-size: 24px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:hover { background: rgba(212, 175, 55, 0.4); transform: scale(1.1); }

        .month-year { display: flex; gap: 10px; }
        .month-year select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--color-gold);
            color: var(--color-gold-light);
            padding: 8px 15px;
            border-radius: var(--border-radius-sm);
            font-family: var(--font-decorative);
            font-size: 16px;
            cursor: pointer;
        }
        .month-year select:focus { outline: none; border-color: var(--color-gold-light); }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }
        .weekdays div {
            text-align: center;
            color: var(--color-purple);
            font-family: var(--font-decorative);
            font-size: 14px;
            padding: 5px;
        }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid transparent;
            border-radius: var(--border-radius-md);
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .calendar-day:hover { background: rgba(212, 175, 55, 0.2); border-color: var(--color-gold); }
        .calendar-day.selected {
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
            color: #000;
            font-weight: bold;
            border-color: var(--color-gold-light);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        .calendar-day.other-month { color: #666; }
        .calendar-day.today { border-color: var(--color-purple); }

        .calculate-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 18px;
            font-family: var(--font-decorative);
        }
        .date-input button { padding: 10px 30px; font-size: 16px; }

        .result-display {
            margin-top: 15px;
            margin-bottom: 10px;
            min-height: 50px;
            position: relative;
            z-index: 100;
        }
        .abode-name {
            font-family: var(--font-decorative);
            font-size: 24px;
            color: var(--color-gold-light);
            font-weight: 600;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6), 0 0 30px rgba(255, 215, 0, 0.3);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .god-phrase {
            font-family: var(--font-body), var(--font-decorative);
            font-size: 18px;
            color: var(--color-gold);
            font-style: italic;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5), 0 0 20px rgba(212, 175, 55, 0.3);
            letter-spacing: 1px;
            margin-top: 8px;
            display: block;
            white-space: normal;
            line-height: 1.2;
            word-break: break-word;
        }

        .main-layout {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 160px;
            width: 100%;
            max-width: 1600px;
            flex: 1;
        }
        .chertog-column {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            column-gap: 90px;
            row-gap: 5px;
            margin-top: -10vh;
        }

        .icon-base {
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.5;
            transition: all var(--transition-fast);
            border: 2px solid transparent;
            position: relative;
        }
        .icon-base img { width: 100%; height: 100%; object-fit: cover; }
        .icon-base:hover { opacity: 1; transform: scale(1.05); }
        .icon-base.active { opacity: 1; animation: rainbow-glow 2s linear infinite; }

        .chertog-icon {
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.5;
            transition: all var(--transition-fast);
            border: 2px solid transparent;
            position: relative;
            width: 171px;
            height: 222px;
        }
        .chertog-icon img { width: 100%; height: 100%; object-fit: cover; }
        
        #chertog-1 img, #chertog-3 img, #chertog-10 img {
            object-position: center 90%;
        }

        #chertog-9 img {
            object-position: center 35%;
        }

        .chertog-icon:hover { opacity: 1; transform: scale(1.05); }
        .chertog-icon.active { opacity: 1; animation: rainbow-glow 2s linear infinite; }

        .thor-section { display: flex; flex-direction: column; align-items: center; }

        .thor-icon {
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.5;
            transition: all var(--transition-fast);
            border: 4px solid transparent;
            position: relative;
            width: 300px;
            height: 420px;
        }
        .thor-icon img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            object-position: center 65%;
        }
        .thor-icon:hover { opacity: 1; transform: scale(1.05); }
        .thor-icon.active { opacity: 1; animation: rainbow-glow 2s linear infinite; }

        @keyframes rainbow-glow {
            0% { filter: drop-shadow(0 0 15px #ff0000) hue-rotate(0deg); border-color: #ff0000; }
            16.66% { filter: drop-shadow(0 0 15px #ff8800) hue-rotate(60deg); border-color: #ff8800; }
            33.33% { filter: drop-shadow(0 0 15px #ffff00) hue-rotate(120deg); border-color: #ffff00; }
            50% { filter: drop-shadow(0 0 15px #00ff00) hue-rotate(180deg); border-color: #00ff00; }
            66.66% { filter: drop-shadow(0 0 15px #0088ff) hue-rotate(240deg); border-color: #0088ff; }
            83.33% { filter: drop-shadow(0 0 15px #8800ff) hue-rotate(300deg); border-color: #8800ff; }
            100% { filter: drop-shadow(0 0 15px #ff0000) hue-rotate(360deg); border-color: #ff0000; }
        }

        /* Optimized animation for mobile devices */
        @media (max-width: 900px) {
            @keyframes rainbow-glow {
                0% { border-color: #ff0000; box-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
                16.66% { border-color: #ff8800; box-shadow: 0 0 10px rgba(255, 136, 0, 0.5); }
                33.33% { border-color: #ffff00; box-shadow: 0 0 10px rgba(255, 255, 0, 0.5); }
                50% { border-color: #00ff00; box-shadow: 0 0 10px rgba(0, 255, 0, 0.5); }
                66.66% { border-color: #0088ff; box-shadow: 0 0 10px rgba(0, 136, 255, 0.5); }
                83.33% { border-color: #8800ff; box-shadow: 0 0 10px rgba(136, 0, 255, 0.5); }
                100% { border-color: #ff0000; box-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: linear-gradient(135deg, var(--color-bg-dark), var(--color-bg-darker));
            border: 3px solid var(--color-gold);
            border-radius: var(--border-radius-xxl);
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            color: var(--color-gold);
            cursor: pointer;
            transition: color var(--transition-fast);
        }
        .modal-close:hover { color: var(--color-red); }
        .modal-title {
            color: var(--color-gold);
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-description {
            color: var(--color-text-muted);
            line-height: 1.8;
            font-size: 24px;
        }
        .icon-label {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: var(--color-gold);
            padding: 2px 6px;
            border-radius: var(--border-radius-sm);
            font-size: 12px;
            white-space: nowrap;
        }
        .debug-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            font-size: 12px;
            z-index: 9999;
        }

        @media (max-width: 900px) {
            .container { padding: 10px; height: auto; min-height: 100vh; }
            .date-calculator { padding: 15px 20px; margin-bottom: 20px; max-height: none; }
            .date-calculator h2 { font-size: 18px; }
            .date-picker { min-width: 150px; padding: 10px 15px; font-size: 14px; }
            .main-layout { flex-direction: column; gap: 30px; }
            .chertog-column {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(2, 1fr);
                gap: 15px;
                margin-top: 0;
            }
            .chertog-icon { width: 100px; height: 130px; }
            .thor-icon { width: 180px; height: 250px; }
            .thor-section { order: -1; margin-bottom: 10px; }
            .abode-name { font-size: 18px; letter-spacing: 1px; }
            .god-phrase { font-size: 14px; }
            .icon-label { font-size: 10px; padding: 1px 5px; }
            .modal-content { max-width: 95%; padding: 20px; margin: 10px; }
            .modal-title { font-size: 20px; }
            .modal-description { font-size: 21px; line-height: 1.6; }
            .mute-btn { padding: 8px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <button class="mute-btn" id="muteBtn">🔊 Звук увімкнено</button>

    <div class="container">
        <div class="date-calculator">
            <h2>Розрахунок скандинавського чертогу</h2>
            <div class="calendar-wrapper">
                <input type="text" id="dateInput" class="date-input-field input-field" placeholder="Оберіть дату" readonly onclick="toggleCalendar()">
                <div class="custom-calendar-popup" id="calendarPopup">
                    <div class="calendar-header">
                        <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
                        <div class="month-year">
                            <select id="monthSelect" onchange="renderCalendar()">
                                <option value="0">Січень</option>
                                <option value="1">Лютий</option>
                                <option value="2">Березень</option>
                                <option value="3">Квітень</option>
                                <option value="4">Травень</option>
                                <option value="5">Червень</option>
                                <option value="6">Липень</option>
                                <option value="7">Серпень</option>
                                <option value="8">Вересень</option>
                                <option value="9">Жовтень</option>
                                <option value="10">Листопад</option>
                                <option value="11">Грудень</option>
                            </select>
                            <select id="yearSelect" onchange="renderCalendar()"></select>
                        </div>
                        <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
                    </div>
                    <div class="weekdays">
                        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Нд</div>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>
                <button class="calculate-btn" onclick="calculateFromCalendar()">Розрахувати</button>
            </div>
            <div class="result-display" id="resultDisplay"></div>
        </div>

        <div class="main-layout">
            <div class="chertog-column" id="leftColumn"></div>
            <div class="thor-section">
                <div class="thor-icon" id="thorIcon" onclick="openModal('thor')">
                    <img src="chertogs/13.Thor.webp" alt="Тор" loading="lazy">
                    <span class="icon-label">Трудгейм</span>
                </div>
            </div>
            <div class="chertog-column" id="rightColumn"></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h3 class="modal-title" id="modalTitle"></h3>
            <div class="modal-description" id="modalDescription"></div>
        </div>
    </div>

    <script src="app_ukr.min.js"></script>
</body>
</html>
